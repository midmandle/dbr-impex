[package]
name = "dbr-impex"
version = "0.1.0"
edition = "2024"

[lib]
name = "dbr_impex"
path = "src/lib.rs"

[[bin]]
name = "dbr-impex"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
opendal = { version = "0.56.0", features = ["services-azblob", "services-dbfs", "services-ftp", "services-gcs", "services-s3", "services-sftp"] }
tempdir = "0.3.7"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "macros"] }
