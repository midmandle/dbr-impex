[package]
name = "dbr-impex"
version = "0.1.0"
edition = "2024"

[lib]
name = "dbr_impex"
path = "src/lib.rs"

[[bin]]
name = "dbr-impex"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.3", features = ["blocking", "multipart"] }
tempdir = "0.3.7"
thiserror = "2.0.18"
